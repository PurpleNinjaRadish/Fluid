plugins {
    id "com.android.application"
}

// Fluid's version is the VERSION file at the top of the repository (the page shows it too).
def fluidVersion = rootProject.file("../VERSION").text.trim()
// The test key in ../keys signs builds for testing. For a school or district, sign with its own key:
// set FLUID_KEYSTORE (path), FLUID_KEY_ALIAS and FLUID_KEY_PASS, for example from GitHub secrets.
def keystore = System.getenv("FLUID_KEYSTORE") ?: "../keys/fluid-test.jks"
def keyPass = System.getenv("FLUID_KEY_PASS") ?: "fluid-test-key"

android {
    namespace "io.github.purpleninjaradish.fluid"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.purpleninjaradish.fluid"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName fluidVersion
        resValue "string", "app_name", "Fluid"
    }

    signingConfigs {
        fluid {
            storeFile file(keystore)
            storePassword keyPass
            keyAlias System.getenv("FLUID_KEY_ALIAS") ?: "fluid-test"
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fluid
        }
        debug {
            // Only for the emulator check on GitHub: it may reach a stand-in AI over plain http on the build machine.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
