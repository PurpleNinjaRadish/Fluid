# Tests Fluid's page (a sample reading, practice and a one-minute reading with a stand-in recognizer, new passages with a
# stand-in AI), then puts the web copy on GitHub Pages: https://purpleninjaradish.github.io/Fluid/
name: Fluid on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "odin/**"
      - "VERSION"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: python3 web/build.py
      - name: Get the test tools
        run: |
          python3 -m pip install -q playwright
          python3 -m playwright install --with-deps chromium
      - name: Test the page
        run: FLUID_TEST_OUT=test-out python3 web/tests/test_fluid.py
      - name: Keep the test pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-test
          path: test-out
          retention-days: 7

  pages:
    # GitHub Pages is turned on once, by the repository's owner: Settings › Pages › Source: GitHub Actions. Until then the
    # deploy job is skipped (checked here, outside the github-pages environment, so its rules don't fail the run).
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.pages.outputs.on }}
    steps:
      - name: Is GitHub Pages on for this repository?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "on=false" >> "$GITHUB_OUTPUT"; echo "::notice::GitHub Pages is off for this repository. Turn it on in Settings > Pages > Source: GitHub Actions, then run this workflow again."; fi

  deploy:
    needs: [test, pages]
    if: needs.pages.outputs.on == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: python3 web/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
